name: Source and container checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Python source checks
        working-directory: backend
        run: |
          python -m ruff check app tests
          python -m ruff format --check app tests
          python -m ruff check --config pyproject.toml ../scripts
          python -m ruff format --check --config pyproject.toml ../scripts
      - name: Backend synthetic tests
        working-directory: backend
        run: python -m pytest -q
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend lint, tests and build
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
      - name: Isolated source startup and persistence
        run: python scripts/source_acceptance.py
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Visual browser acceptance with disposable Mock Mode
        working-directory: frontend
        run: npm run test:e2e
      - name: Editor browser acceptance with disposable Mock Mode
        working-directory: frontend
        run: npm run test:e2e:editor
      - name: Retain browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.os }}-${{ github.run_attempt }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify and package public source
        run: |
          python scripts/verify_release.py
          python scripts/build_release.py

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Dependency and static security checks
        run: |
          python -m pip install pip-audit==2.10.1 bandit==1.9.4
          python -m pip_audit -r backend/requirements.txt --no-deps --disable-pip
          python -m bandit -r backend/app -ll
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          npm --prefix frontend audit --audit-level=low
      - name: Download checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_checksums.txt
          grep '  gitleaks_8.30.0_linux_x64.tar.gz$' gitleaks_8.30.0_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz gitleaks
      - name: Scan exactly the public archive contents
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py
          version="$(cat VERSION)"
          python -m zipfile -e "dist/sdex-connectmap-${version}-source.zip" "$RUNNER_TEMP/connectmap-public"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/connectmap-public" --redact --no-banner

  container:
    needs: [source, security]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate deployment definitions
        run: |
          docker compose config --quiet
          docker compose -f portainer-stack.yml config --quiet
      - name: Build the packaged Docker context natively
        run: |
          python scripts/build_release.py
          version="$(cat VERSION)"
          docker build -t sdex-connectmap:ci - < "dist/sdex-connectmap-${version}-build-context.tar"
      - name: Disposable container acceptance
        run: python scripts/container_acceptance.py --image sdex-connectmap:ci
      - name: Download checksum-pinned image scanner
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              archive=trivy_0.75.0_Linux-64bit.tar.gz
              checksum=c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
              ;;
            aarch64|arm64)
              archive=trivy_0.75.0_Linux-ARM64.tar.gz
              checksum=a1ee9f6ffb7d112b64ff726a2a0717c21175c1114361391f4a132956751a13b3
              ;;
            *) echo "Unsupported scanner architecture" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/connectmap-trivy"
          cd "$RUNNER_TEMP/connectmap-trivy"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v0.75.0/$archive" -o "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" trivy
      - name: Image advisory and license inventory (informational findings)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/image_security_report.py \
            --image sdex-connectmap:ci \
            --output "$RUNNER_TEMP/connectmap-image-review" \
            --cache-dir "$RUNNER_TEMP/connectmap-trivy-cache" \
            --trivy "$RUNNER_TEMP/connectmap-trivy/trivy"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'connectmap-image-review/report.json').read_text())
          gate = report['high_critical_gate']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(f"Image scan execution: {report['scan_execution']}\n\n")
              summary.write(f"HIGH/CRITICAL vulnerability gate: **{gate['status']}** "
                            f"({gate['package_advisory_pairs']} package/advisory pairs; "
                            f"{gate['unique_cves']} unique CVEs).\n\n")
              summary.write("Findings are informational and require release review. "
                            "A successful job is not vulnerability clearance. "
                            "Scanner execution or inconsistent evidence errors fail the job.\n")
          PY
      - name: Retain complete image review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-review-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/connectmap-image-review/
          if-no-files-found: warn
          retention-days: 14
