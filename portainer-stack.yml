# Build sdex-connectmap:1.0.1 on the target environment before deploying.
services:
  connectmap:
    image: ${CONNECTMAP_IMAGE:-sdex-connectmap:1.0.1}
    restart: unless-stopped
    ports:
      - "${CONNECTMAP_BIND_ADDRESS:-127.0.0.1}:${CONNECTMAP_HOST_PORT:-8080}:8080"
    environment:
      CONNECTMAP_HOST: 0.0.0.0
      CONNECTMAP_PORT: "8080"
      CONNECTMAP_DATA_DIR: /data
      CONNECTMAP_DISABLE_DOCS: "true"
      CONNECTMAP_MOCK_MODE: ${CONNECTMAP_MOCK_MODE:-false}
      CONNECTMAP_MOCK_SCENARIO: ${CONNECTMAP_MOCK_SCENARIO:-dynamic}
      CONNECTMAP_SECRET_KEY: ${CONNECTMAP_SECRET_KEY:-}
      CONNECTMAP_DEFAULT_REFRESH_SECONDS: ${CONNECTMAP_DEFAULT_REFRESH_SECONDS:-300}
      SDEX_VERIFY_TLS: "true"
    volumes:
      - connectmap-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  connectmap-data:
